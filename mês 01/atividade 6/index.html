<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>radio</title>
  </head>
  <body>
    <form 
    <p>Metodo de contato</p>
    <label for="zapzap">ZapZap</label>
    <input
      id="zapzap"
      type="radio"
      required 
      name="metodoDeContato"
      value="zapzap"
    />

    <label for="telefone">Telefone</label>
    <input
      id="telefone"
      type="radio"
      required 
      name="metodoDeContato"
      value="telefone"
    />

    <label for="telegram">Telegram</label>
    <input
      id="telegram"
      type="radio"
      required
      name="metodoDeContato"
      value="telegram"
    />

    <button type="submit">Enviar</button>
</form>   
</body>
</html>
